<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Gestão de Tarefas Unitário</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- SheetJS (Excel Export) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        .task-delayed {
            border-left: 4px solid #ef4444 !important;
            background-color: #fef2f2 !important;
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen flex flex-col">

    <!-- Header / Navbar -->
    <header class="bg-slate-900 text-white shadow-md sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 py-3 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center space-x-3">
                <div class="bg-blue-600 p-2.5 rounded-xl shadow-lg">
                    <i class="fa-solid fa-list-check text-xl"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-wide">Gestão de Tarefas</h1>
                    <p class="text-xs text-slate-400">Painel Unitário & Visão em Funil</p>
                </div>
            </div>

            <!-- Navegação por Visões -->
            <div class="flex items-center bg-slate-800 p-1 rounded-lg border border-slate-700">
                <button id="tab-dashboard-btn" onclick="switchView('dashboard')" class="px-4 py-1.5 text-xs font-semibold rounded-md transition-all bg-blue-600 text-white shadow-sm flex items-center gap-2">
                    <i class="fa-solid fa-table-cells"></i> Visão Geral
                </button>
                <button id="tab-funnel-btn" onclick="switchView('funnel')" class="px-4 py-1.5 text-xs font-semibold rounded-md transition-all text-slate-300 hover:text-white flex items-center gap-2">
                    <i class="fa-solid fa-filter flex-shrink-0"></i> Visão em Funil
                </button>
            </div>
            
            <div class="flex flex-wrap items-center gap-2">
                <button onclick="openModal()" class="bg-blue-600 hover:bg-blue-500 text-white text-sm font-medium px-4 py-2 rounded-lg transition-all flex items-center gap-2 shadow-sm">
                    <i class="fa-solid fa-plus"></i> Nova Tarefa
                </button>
                <button onclick="exportToExcel()" class="bg-emerald-600 hover:bg-emerald-500 text-white text-sm font-medium px-4 py-2 rounded-lg transition-all flex items-center gap-2 shadow-sm">
                    <i class="fa-solid fa-file-excel"></i> Exportar Excel
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto px-4 py-6 flex-grow w-full space-y-6">

        <!-- Dashboard Cards (Visíveis em ambas as visões) -->
        <section class="grid grid-cols-2 md:grid-cols-5 gap-4">
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                <p class="text-xs font-semibold text-slate-500 uppercase">Total</p>
                <h3 id="stat-total" class="text-2xl font-bold text-slate-800 mt-1">0</h3>
            </div>
            <!-- A Iniciar em AZUL -->
            <div class="bg-white p-4 rounded-xl shadow-sm border-l-4 border-l-blue-500 border border-slate-200">
                <p class="text-xs font-semibold text-blue-600 uppercase">A Iniciar</p>
                <h3 id="stat-pending" class="text-2xl font-bold text-blue-600 mt-1">0</h3>
            </div>
            <!-- Em Andamento em AMARELO -->
            <div class="bg-white p-4 rounded-xl shadow-sm border-l-4 border-l-amber-500 border border-slate-200">
                <p class="text-xs font-semibold text-amber-600 uppercase">Em Andamento</p>
                <h3 id="stat-progress" class="text-2xl font-bold text-amber-600 mt-1">0</h3>
            </div>
            <!-- Concluídas em VERDE -->
            <div class="bg-white p-4 rounded-xl shadow-sm border-l-4 border-l-emerald-500 border border-slate-200">
                <p class="text-xs font-semibold text-emerald-600 uppercase">Concluídas</p>
                <h3 id="stat-completed" class="text-2xl font-bold text-emerald-600 mt-1">0</h3>
            </div>
            <!-- Atrasadas em VERMELHO -->
            <div class="bg-white p-4 rounded-xl shadow-sm border-l-4 border-l-red-500 border border-red-200 bg-red-50/50 col-span-2 md:col-span-1">
                <p class="text-xs font-semibold text-red-600 uppercase flex items-center gap-1">
                    <i class="fa-solid fa-triangle-exclamation"></i> Atrasadas
                </p>
                <h3 id="stat-delayed" class="text-2xl font-bold text-red-600 mt-1">0</h3>
            </div>
        </section>

        <!-- VISÃO 1: DASHBOARD GERAL (LISTA + CALENDÁRIO) -->
        <div id="view-dashboard" class="grid grid-cols-1 lg:grid-cols-12 gap-6">

            <!-- Esquerda: Lista de Tarefas (7 Cols) -->
            <section class="lg:col-span-7 bg-white rounded-xl shadow-sm border border-slate-200 flex flex-col">
                <div class="p-4 border-b border-slate-200 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
                    <h2 class="font-bold text-slate-800 flex items-center gap-2">
                        <i class="fa-solid fa-tasks text-blue-600"></i> Lista de Tarefas
                    </h2>
                    
                    <div class="flex flex-wrap gap-2 w-full sm:w-auto">
                        <input type="text" id="search-input" oninput="render()" placeholder="Buscar tarefa..." class="text-sm px-3 py-1.5 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 flex-grow sm:w-40">
                        <select id="filter-status" onchange="render()" class="text-sm px-3 py-1.5 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                            <option value="ALL">Todos Status</option>
                            <option value="A Iniciar">A Iniciar</option>
                            <option value="Em Andamento">Em Andamento</option>
                            <option value="Concluído">Concluído</option>
                            <option value="Atrasadas">Somente Atrasadas</option>
                        </select>
                    </div>
                </div>

                <div class="overflow-x-auto custom-scrollbar flex-grow min-h-[350px]">
                    <table class="w-full text-left text-sm border-collapse">
                        <thead class="bg-slate-50 text-slate-600 uppercase text-[11px] tracking-wider border-b border-slate-200">
                            <tr>
                                <th class="p-3">ID / Tarefa</th>
                                <th class="p-3">Categoria</th>
                                <th class="p-3">Vencimento</th>
                                <th class="p-3">Status</th>
                                <th class="p-3 text-center">Ações</th>
                            </tr>
                        </thead>
                        <tbody id="task-table-body" class="divide-y divide-slate-100">
                            <!-- Injetado via JS -->
                        </tbody>
                    </table>
                </div>
            </section>

            <!-- Direita: Calendário (5 Cols) -->
            <section class="lg:col-span-5 bg-white rounded-xl shadow-sm border border-slate-200 flex flex-col p-4">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="font-bold text-slate-800 flex items-center gap-2">
                        <i class="fa-solid fa-calendar-days text-blue-600"></i> Calendário
                    </h2>
                    <div class="flex items-center gap-2">
                        <button onclick="changeMonth(-1)" class="p-1.5 hover:bg-slate-100 rounded-lg text-slate-600"><i class="fa-solid fa-chevron-left"></i></button>
                        <span id="calendar-month-year" class="text-sm font-semibold text-slate-700 min-w-[120px] text-center"></span>
                        <button onclick="changeMonth(1)" class="p-1.5 hover:bg-slate-100 rounded-lg text-slate-600"><i class="fa-solid fa-chevron-right"></i></button>
                    </div>
                </div>

                <div class="grid grid-cols-7 gap-1 text-center font-semibold text-xs text-slate-400 mb-2">
                    <div>Dom</div><div>Seg</div><div>Ter</div><div>Qua</div><div>Qui</div><div>Sex</div><div>Sáb</div>
                </div>

                <div id="calendar-grid" class="grid grid-cols-7 gap-1 flex-grow">
                    <!-- Dias injetados via JS -->
                </div>
            </section>

        </div>

        <!-- VISÃO 2: FUNIL DE ACOMPANHAMENTO (KANBAN) -->
        <div id="view-funnel" class="hidden">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                
                <!-- Etapa 1: A Iniciar (AZUL) -->
                <div class="bg-slate-50 border border-slate-200 rounded-xl flex flex-col min-h-[550px] shadow-sm">
                    <div class="p-3.5 border-b border-blue-200 bg-blue-50/70 rounded-t-xl flex justify-between items-center">
                        <span class="font-bold text-blue-800 text-sm flex items-center gap-2">
                            <span class="w-2.5 h-2.5 rounded-full bg-blue-500"></span> A Iniciar
                        </span>
                        <span id="funnel-count-pending" class="text-xs bg-blue-200 text-blue-800 font-bold px-2 py-0.5 rounded-full">0</span>
                    </div>
                    <div id="funnel-pending" class="p-3 space-y-3 flex-grow overflow-y-auto custom-scrollbar">
                        <!-- Injetado via JS -->
                    </div>
                </div>

                <!-- Etapa 2: Em Andamento (AMARELO) -->
                <div class="bg-slate-50 border border-slate-200 rounded-xl flex flex-col min-h-[550px] shadow-sm">
                    <div class="p-3.5 border-b border-amber-200 bg-amber-50/70 rounded-t-xl flex justify-between items-center">
                        <span class="font-bold text-amber-800 text-sm flex items-center gap-2">
                            <span class="w-2.5 h-2.5 rounded-full bg-amber-500"></span> Em Andamento
                        </span>
                        <span id="funnel-count-progress" class="text-xs bg-amber-200 text-amber-800 font-bold px-2 py-0.5 rounded-full">0</span>
                    </div>
                    <div id="funnel-progress" class="p-3 space-y-3 flex-grow overflow-y-auto custom-scrollbar">
                        <!-- Injetado via JS -->
                    </div>
                </div>

                <!-- Etapa 3: Concluído (VERDE) -->
                <div class="bg-slate-50 border border-slate-200 rounded-xl flex flex-col min-h-[550px] shadow-sm">
                    <div class="p-3.5 border-b border-emerald-200 bg-emerald-50/70 rounded-t-xl flex justify-between items-center">
                        <span class="font-bold text-emerald-800 text-sm flex items-center gap-2">
                            <span class="w-2.5 h-2.5 rounded-full bg-emerald-500"></span> Concluído
                        </span>
                        <span id="funnel-count-completed" class="text-xs bg-emerald-200 text-emerald-800 font-bold px-2 py-0.5 rounded-full">0</span>
                    </div>
                    <div id="funnel-completed" class="p-3 space-y-3 flex-grow overflow-y-auto custom-scrollbar">
                        <!-- Injetado via JS -->
                    </div>
                </div>

            </div>
        </div>

    </main>

    <!-- Modal Form (Criar / Editar Tarefa) -->
    <div id="task-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4 hidden z-50">
        <div class="bg-white rounded-xl shadow-2xl max-w-lg w-full overflow-hidden transform transition-all">
            <div class="bg-slate-900 px-6 py-4 text-white flex justify-between items-center">
                <h3 id="modal-title" class="font-bold text-lg">Nova Tarefa Unitária</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            
            <form id="task-form" onsubmit="saveTask(event)" class="p-6 space-y-4">
                <input type="hidden" id="task-id">
                
                <div>
                    <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Título da Tarefa *</label>
                    <input type="text" id="task-title" required class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Categoria</label>
                        <input type="text" id="task-category" placeholder="Ex: RH, Manutenção..." class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Prioridade</label>
                        <select id="task-priority" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                            <option value="Baixa">Baixa</option>
                            <option value="Média" selected>Média</option>
                            <option value="Alta">Alta</option>
                            <option value="Urgente">Urgente</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Data Início</label>
                        <input type="date" id="task-start-date" required class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Data Vencimento *</label>
                        <input type="date" id="task-due-date" required class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Status</label>
                    <select id="task-status" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                        <option value="A Iniciar">A Iniciar</option>
                        <option value="Em Andamento">Em Andamento</option>
                        <option value="Concluído">Concluído</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Observações Unitárias</label>
                    <textarea id="task-notes" rows="3" placeholder="Detalhes, links, motivos de atraso..." class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none"></textarea>
                </div>

                <div class="flex justify-end gap-2 pt-2 border-t border-slate-100">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 border border-slate-300 rounded-lg text-slate-600 hover:bg-slate-50 text-sm font-medium">Cancelar</button>
                    <button type="submit" class="px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded-lg text-sm font-medium">Salvar Tarefa</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Application Script -->
    <script>
        let tasks = JSON.parse(localStorage.getItem('unit_tasks_app')) || [];
        let currentDate = new Date();
        let activeView = 'dashboard';

        function saveToLocalStorage() {
            localStorage.setItem('unit_tasks_app', JSON.stringify(tasks));
        }

        function isDelayed(dueDateStr, status) {
            if (status === 'Concluído') return false;
            const today = new Date();
            today.setHours(0,0,0,0);
            const due = new Date(dueDateStr + 'T00:00:00');
            return due < today;
        }

        function switchView(view) {
            activeView = view;
            const dashView = document.getElementById('view-dashboard');
            const funnelView = document.getElementById('view-funnel');
            const dashBtn = document.getElementById('tab-dashboard-btn');
            const funnelBtn = document.getElementById('tab-funnel-btn');

            if (view === 'dashboard') {
                dashView.classList.remove('hidden');
                funnelView.classList.add('hidden');
                dashBtn.className = "px-4 py-1.5 text-xs font-semibold rounded-md transition-all bg-blue-600 text-white shadow-sm flex items-center gap-2";
                funnelBtn.className = "px-4 py-1.5 text-xs font-semibold rounded-md transition-all text-slate-300 hover:text-white flex items-center gap-2";
            } else {
                dashView.classList.add('hidden');
                funnelView.classList.remove('hidden');
                funnelBtn.className = "px-4 py-1.5 text-xs font-semibold rounded-md transition-all bg-blue-600 text-white shadow-sm flex items-center gap-2";
                dashBtn.className = "px-4 py-1.5 text-xs font-semibold rounded-md transition-all text-slate-300 hover:text-white flex items-center gap-2";
            }
            render();
        }

        function render() {
            renderStats();
            if (activeView === 'dashboard') {
                renderTable();
                renderCalendar();
            } else {
                renderFunnel();
            }
        }

        function renderStats() {
            const total = tasks.length;
            const pending = tasks.filter(t => t.status === 'A Iniciar').length;
            const progress = tasks.filter(t => t.status === 'Em Andamento').length;
            const completed = tasks.filter(t => t.status === 'Concluído').length;
            const delayed = tasks.filter(t => isDelayed(t.dueDate, t.status)).length;

            document.getElementById('stat-total').innerText = total;
            document.getElementById('stat-pending').innerText = pending;
            document.getElementById('stat-progress').innerText = progress;
            document.getElementById('stat-completed').innerText = completed;
            document.getElementById('stat-delayed').innerText = delayed;
        }

        function renderTable() {
            const tbody = document.getElementById('task-table-body');
            const search = document.getElementById('search-input').value.toLowerCase();
            const filterStatus = document.getElementById('filter-status').value;

            tbody.innerHTML = '';

            const filteredTasks = tasks.filter(t => {
                const matchesSearch = t.title.toLowerCase().includes(search) || 
                                      (t.category && t.category.toLowerCase().includes(search)) ||
                                      (t.notes && t.notes.toLowerCase().includes(search));
                
                let matchesStatus = true;
                if (filterStatus === 'Atrasadas') {
                    matchesStatus = isDelayed(t.dueDate, t.status);
                } else if (filterStatus !== 'ALL') {
                    matchesStatus = t.status === filterStatus;
                }

                return matchesSearch && matchesStatus;
            });

            if (filteredTasks.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="p-8 text-center text-slate-400">Nenhuma tarefa encontrada.</td></tr>`;
                return;
            }

            filteredTasks.forEach(task => {
                const delayed = isDelayed(task.dueDate, task.status);
                const tr = document.createElement('tr');
                tr.className = `hover:bg-slate-50 border-b border-slate-100 transition-colors ${delayed ? 'task-delayed' : ''}`;

                const formattedDueDate = new Date(task.dueDate + 'T00:00:00').toLocaleDateString('pt-BR');

                let statusBadge = '';
                if (task.status === 'Concluído') {
                    statusBadge = `<span class="px-2 py-1 text-[10px] font-bold rounded-full bg-emerald-100 text-emerald-700"><i class="fa-solid fa-circle-check"></i> Concluído</span>`;
                } else if (delayed) {
                    statusBadge = `<span class="px-2 py-1 text-[10px] font-bold rounded-full bg-red-100 text-red-700 animate-pulse"><i class="fa-solid fa-clock"></i> Atrasado</span>`;
                } else if (task.status === 'Em Andamento') {
                    statusBadge = `<span class="px-2 py-1 text-[10px] font-bold rounded-full bg-amber-100 text-amber-700"><i class="fa-solid fa-spinner"></i> Em Andamento</span>`;
                } else {
                    statusBadge = `<span class="px-2 py-1 text-[10px] font-bold rounded-full bg-blue-100 text-blue-700"><i class="fa-solid fa-hourglass-start"></i> A Iniciar</span>`;
                }

                tr.innerHTML = `
                    <td class="p-3">
                        <div class="text-xs text-slate-400 font-mono">#${task.id}</div>
                        <div class="font-medium text-slate-800 ${task.status === 'Concluído' ? 'line-through text-slate-400' : ''}">${task.title}</div>
                        ${task.notes ? `<div class="text-xs text-slate-500 italic mt-0.5 max-w-xs truncate">${task.notes}</div>` : ''}
                    </td>
                    <td class="p-3">
                        <span class="text-xs bg-slate-100 px-2 py-0.5 rounded text-slate-600">${task.category || 'Geral'}</span>
                    </td>
                    <td class="p-3 text-xs ${delayed ? 'font-bold text-red-600' : 'text-slate-600'}">
                        ${formattedDueDate}
                    </td>
                    <td class="p-3">${statusBadge}</td>
                    <td class="p-3 text-center">
                        <div class="flex justify-center items-center gap-1">
                            <button onclick="editTask(${task.id})" class="p-1.5 text-slate-400 hover:text-blue-600 hover:bg-blue-50 rounded"><i class="fa-solid fa-pen"></i></button>
                            <button onclick="deleteTask(${task.id})" class="p-1.5 text-slate-400 hover:text-red-600 hover:bg-red-50 rounded"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function renderCalendar() {
            const grid = document.getElementById('calendar-grid');
            const monthYearText = document.getElementById('calendar-month-year');
            grid.innerHTML = '';

            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();

            const monthNames = ["Janeiro", "Fevereiro", "Março", "Abril", "Maio", "Junho", "Julho", "Agosto", "Setembro", "Outubro", "Novembro", "Dezembro"];
            monthYearText.innerText = `${monthNames[month]} ${year}`;

            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();

            for (let i = 0; i < firstDay; i++) {
                const emptyCell = document.createElement('div');
                emptyCell.className = "min-h-[60px] bg-slate-50/50 rounded-lg";
                grid.appendChild(emptyCell);
            }

            for (let day = 1; day <= daysInMonth; day++) {
                const dayDateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                
                const dayTasks = tasks.filter(t => t.dueDate === dayDateStr);

                const cell = document.createElement('div');
                cell.className = "min-h-[60px] p-1 border border-slate-100 rounded-lg flex flex-col justify-start bg-white hover:border-blue-300 transition-colors";
                
                let dayHeader = `<span class="text-xs font-semibold text-slate-600 mb-1">${day}</span>`;
                cell.innerHTML = dayHeader;

                dayTasks.forEach(task => {
                    const delayed = isDelayed(task.dueDate, task.status);
                    const pill = document.createElement('div');
                    
                    let bgClass = "bg-blue-100 text-blue-800"; // A Iniciar
                    if (task.status === 'Concluído') bgClass = "bg-emerald-100 text-emerald-800 line-through";
                    else if (task.status === 'Em Andamento') bgClass = "bg-amber-100 text-amber-800";
                    
                    if (delayed) bgClass = "bg-red-500 text-white font-bold";

                    pill.className = `text-[9px] px-1 py-0.5 rounded truncate cursor-pointer my-0.5 ${bgClass}`;
                    pill.innerText = task.title;
                    pill.onclick = (e) => { e.stopPropagation(); editTask(task.id); };
                    cell.appendChild(pill);
                });

                grid.appendChild(cell);
            }
        }

        // RENDER DA VISÃO EM FUNIL
        function renderFunnel() {
            const containerPending = document.getElementById('funnel-pending');
            const containerProgress = document.getElementById('funnel-progress');
            const containerCompleted = document.getElementById('funnel-completed');

            containerPending.innerHTML = '';
            containerProgress.innerHTML = '';
            containerCompleted.innerHTML = '';

            // Função para ordenar por data de vencimento
            const sortByDueDate = (a, b) => new Date(a.dueDate) - new Date(b.dueDate);

            const pendingTasks = tasks.filter(t => t.status === 'A Iniciar').sort(sortByDueDate);
            const progressTasks = tasks.filter(t => t.status === 'Em Andamento').sort(sortByDueDate);
            const completedTasks = tasks.filter(t => t.status === 'Concluído').sort(sortByDueDate);

            document.getElementById('funnel-count-pending').innerText = pendingTasks.length;
            document.getElementById('funnel-count-progress').innerText = progressTasks.length;
            document.getElementById('funnel-count-completed').innerText = completedTasks.length;

            const createCard = (task) => {
                const delayed = isDelayed(task.dueDate, task.status);
                const formattedDueDate = new Date(task.dueDate + 'T00:00:00').toLocaleDateString('pt-BR');
                
                const card = document.createElement('div');
                card.className = `bg-white p-3.5 rounded-lg border shadow-sm space-y-2 hover:shadow-md transition-all ${delayed ? 'border-red-400 bg-red-50/40' : 'border-slate-200'}`;
                
                card.innerHTML = `
                    <div class="flex justify-between items-start gap-2">
                        <span class="text-[10px] font-mono text-slate-400">#${task.id}</span>
                        <span class="text-[10px] font-semibold px-2 py-0.5 rounded bg-slate-100 text-slate-600">${task.category || 'Geral'}</span>
                    </div>
                    <h4 class="font-bold text-slate-800 text-sm ${task.status === 'Concluído' ? 'line-through text-slate-400' : ''}">${task.title}</h4>
                    ${task.notes ? `<p class="text-xs text-slate-500 line-clamp-2 italic">${task.notes}</p>` : ''}
                    <div class="pt-2 border-t border-slate-100 flex justify-between items-center text-xs">
                        <span class="${delayed ? 'text-red-600 font-bold flex items-center gap-1' : 'text-slate-500'}">
                            <i class="fa-regular fa-calendar"></i> ${formattedDueDate} ${delayed ? '(Atrasado)' : ''}
                        </span>
                        <div class="flex items-center gap-1">
                            <button onclick="editTask(${task.id})" class="p-1 text-slate-400 hover:text-blue-600 rounded"><i class="fa-solid fa-pen"></i></button>
                            <button onclick="deleteTask(${task.id})" class="p-1 text-slate-400 hover:text-red-600 rounded"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    </div>
                `;
                return card;
            };

            if (pendingTasks.length === 0) containerPending.innerHTML = `<p class="text-xs text-center text-slate-400 py-4">Sem tarefas a iniciar.</p>`;
            else pendingTasks.forEach(t => containerPending.appendChild(createCard(t)));

            if (progressTasks.length === 0) containerProgress.innerHTML = `<p class="text-xs text-center text-slate-400 py-4">Nenhuma tarefa em andamento.</p>`;
            else progressTasks.forEach(t => containerProgress.appendChild(createCard(t)));

            if (completedTasks.length === 0) containerCompleted.innerHTML = `<p class="text-xs text-center text-slate-400 py-4">Nenhuma tarefa concluída.</p>`;
            else completedTasks.forEach(t => containerCompleted.appendChild(createCard(t)));
        }

        function changeMonth(delta) {
            currentDate.setMonth(currentDate.getMonth() + delta);
            renderCalendar();
        }

        function openModal(editing = false) {
            if (!editing) {
                document.getElementById('task-form').reset();
                document.getElementById('task-id').value = '';
                document.getElementById('modal-title').innerText = 'Nova Tarefa Unitária';
                
                const today = new Date().toISOString().split('T')[0];
                document.getElementById('task-start-date').value = today;
                document.getElementById('task-due-date').value = today;
            }
            document.getElementById('task-modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('task-modal').classList.add('hidden');
        }

        function saveTask(event) {
            event.preventDefault();

            const id = document.getElementById('task-id').value;
            const title = document.getElementById('task-title').value;
            const category = document.getElementById('task-category').value;
            const priority = document.getElementById('task-priority').value;
            const startDate = document.getElementById('task-start-date').value;
            const dueDate = document.getElementById('task-due-date').value;
            const status = document.getElementById('task-status').value;
            const notes = document.getElementById('task-notes').value;

            if (id) {
                const index = tasks.findIndex(t => t.id == id);
                if (index !== -1) {
                    tasks[index] = { id: parseInt(id), title, category, priority, startDate, dueDate, status, notes };
                }
            } else {
                const newId = tasks.length > 0 ? Math.max(...tasks.map(t => t.id)) + 1 : 1;
                tasks.push({ id: newId, title, category, priority, startDate, dueDate, status, notes });
            }

            saveToLocalStorage();
            closeModal();
            render();
        }

        function editTask(id) {
            const task = tasks.find(t => t.id === id);
            if (!task) return;

            document.getElementById('task-id').value = task.id;
            document.getElementById('task-title').value = task.title;
            document.getElementById('task-category').value = task.category || '';
            document.getElementById('task-priority').value = task.priority || 'Média';
            document.getElementById('task-start-date').value = task.startDate;
            document.getElementById('task-due-date').value = task.dueDate;
            document.getElementById('task-status').value = task.status;
            document.getElementById('task-notes').value = task.notes || '';

            document.getElementById('modal-title').innerText = `Editar Tarefa #${task.id}`;
            openModal(true);
        }

        function deleteTask(id) {
            if (confirm('Tem certeza de que deseja excluir esta tarefa?')) {
                tasks = tasks.filter(t => t.id !== id);
                saveToLocalStorage();
                render();
            }
        }

        function exportToExcel() {
            if (tasks.length === 0) {
                alert('Não há tarefas registradas para exportar.');
                return;
            }

            const excelData = tasks.map(t => ({
                "ID": t.id,
                "Tarefa": t.title,
                "Categoria": t.category || "Geral",
                "Prioridade": t.priority || "Média",
                "Data de Início": t.startDate,
                "Data de Vencimento": t.dueDate,
                "Status": t.status,
                "Atrasado": isDelayed(t.dueDate, t.status) ? "SIM" : "NÃO",
                "Observações": t.notes || ""
            }));

            const worksheet = XLSX.utils.json_to_sheet(excelData);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "Relatório de Tarefas");

            XLSX.writeFile(workbook, `Relatorio_Tarefas_${new Date().toISOString().split('T')[0]}.xlsx`);
        }

        // Dados Iniciais
        if (tasks.length === 0) {
            const todayStr = new Date().toISOString().split('T')[0];
            const pastDate = new Date();
            pastDate.setDate(pastDate.getDate() - 3);
            const pastDateStr = pastDate.toISOString().split('T')[0];

            tasks = [
                { id: 1, title: 'Revisar folha de pagamento', category: 'RH', priority: 'Alta', startDate: pastDateStr, dueDate: pastDateStr, status: 'A Iniciar', notes: 'Verificar adicionais noturnos e DSR.' },
                { id: 2, title: 'Manutenção preventiva veículo', category: 'Manutenção', priority: 'Média', startDate: todayStr, dueDate: todayStr, status: 'Em Andamento', notes: 'Verificar resistor da ventoinha do radiador.' }
            ];
            saveToLocalStorage();
        }

        render();
    </script>
</body>
</html>
